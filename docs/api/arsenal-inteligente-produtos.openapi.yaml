        cpf: { type: string }
        status: { type: string, description: 'Ex.: `ativa`, `pendente`, `cancelada`.' }
        valor_anual: { type: number }
        periodo_inicio: { type: string, format: date }
        periodo_fim: { type: string, format: date }
        forma_pagamento: { type: [string, "null"], enum: [CREDIT_CARD, PIX, BOLETO, null] }
        origem_gratuidade:
          type: [string, "null"]
          description: Preenchido quando o período foi concedido como cortesia.
        aceite_contrato_em: { type: [string, "null"], format: date-time }
        aceite_contrato_ip: { type: [string, "null"] }
        cancelamento_solicitado_em: { type: [string, "null"], format: date-time }
        card_verificado: { type: boolean }
        asaas_payment_id: { type: [string, "null"] }
        asaas_invoice_url: { type: [string, "null"] }
        asaas_verificacao_payment_id: { type: [string, "null"] }
        asaas_credit_card_token: { type: [string, "null"] }
        asaas_credit_card_brand: { type: [string, "null"], example: VISA }
        asaas_credit_card_last4: { type: [string, "null"], example: "4242" }
        asaas_credit_card_holder: { type: [string, "null"] }
        asaas_credit_card_expiry: { type: [string, "null"] }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }

    ArsenalAssinarRequest:
      type: object
      required: [forma, aceite]
      properties:
        forma: { type: string, enum: [CREDIT_CARD, PIX, BOLETO] }
        aceite:
          type: boolean
          const: true
          description: Aceite do termo de adesão. Precisa ser `true`.
        verificacao_id: { type: string }
        card_token: { type: string }
        card_brand: { type: string }
        card_last4: { type: string }
        card_holder: { type: string }
        card_expiry: { type: string }
      additionalProperties: false

    ArsenalAssinarResponse:
      type: object
      properties:
        success: { type: boolean }
        modo:
          type: string
          enum: [gratuidade, cobranca_pendente, cobranca]
        assinatura_id: { type: string, format: uuid }
        periodo_fim: { type: string, format: date }
        meses_gratis: { type: integer, description: Só no modo `gratuidade`. }
        forma: { type: string, description: Só no modo `cobranca`. }
        valor_anual: { type: number }
        parcelas: { type: integer }
        invoice_url: { type: [string, "null"] }
        bank_slip_url: { type: [string, "null"] }
        pix_payload: { type: [string, "null"], description: Copia-e-cola do PIX. }
        pix_encoded_image: { type: [string, "null"], description: QR code em base64. }
        due_date: { type: string, format: date }
        card_brand: { type: [string, "null"] }
        card_last4: { type: [string, "null"] }

    ArsenalCartaoRequest:
      type: object
      description: Sem corpo = consulta o cartão salvo. Com os campos = tokeniza um novo.
      properties:
        holderName: { type: string }
        number: { type: string, description: Não é persistido — vai só para a Asaas. }
        expiryMonth: { type: string }
        expiryYear: { type: string }
        ccv: { type: string, description: Não é persistido. }
      additionalProperties: true

    ArsenalCartaoResponse:
      type: object
      properties:
        success: { type: boolean }
        brand: { type: [string, "null"], example: VISA }
        last4: { type: [string, "null"], example: "4242" }
        holder: { type: [string, "null"] }
        expiry: { type: [string, "null"] }

    CrafExtraido:
      type: object
      description: Campos que a IA extrai de um CRAF.
      properties:
        numero_craf: { type: string }
        data_emissao: { type: string, description: DD/MM/AAAA }
        data_validade: { type: string, description: DD/MM/AAAA }
        orgao_emissor: { type: string }
        numero_serie: { type: string }
        sigma_ou_sinarm: { type: string }
        numero_cad_sinarm: { type: string, example: 2022/905178870-50 }
        numero_registro_sigma: { type: string }
        sistema_registro: { type: string, enum: [SINARM, SIGMA, REVISAR] }
        marca: { type: string }
        modelo:
          type: string
          description: Modelo comercial. Vem vazio quando a IA não identifica — nunca genérico.
        calibre: { type: string }
        modelo_invalido: { type: boolean }

    GteExtraida:
      type: object
      description: Campos que a IA extrai de uma GTE.
      properties:
        numero_gte: { type: string }
        orgao_emissor: { type: string }
        requerente_nome: { type: string }
        requerente_cpf: { type: string }
        data_emissao: { type: string, description: DD/MM/AAAA }
        data_validade: { type: string, description: DD/MM/AAAA }
        endereco_origem: { type: string }
        endereco_destino: { type: string }
        armas:
          type: array
          items:
            type: object
            properties:
              marca: { type: string }
              modelo: { type: string }
              calibre: { type: string }
              especie: { type: string, example: Pistola }
              numero_serie: { type: string }
              numero_sigma: { type: string }
        enderecos:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string, example: destino }
              endereco: { type: string }
        clubes:
          type: array
          items:
            type: object
            additionalProperties: true
